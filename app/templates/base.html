<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        PlasticVision AI
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for(
            'static',
            filename='css/style.css'
        ) }}"
    >

</head>


<body>


<header class="topbar">

    <div class="nav-container">

        <a
            href="{{ url_for('index') }}"
            class="brand"
        >

            <span class="brand-icon">
                P
            </span>

            PlasticVision AI

        </a>


        <nav>

            <a
                href="{{ url_for('index') }}"
            >
                Analyse
            </a>

        </nav>

    </div>

</header>


<main>

    {% block content %}
    {% endblock %}

</main>


<footer>

    <strong>
        PlasticVision AI
    </strong>

    <span>
        EfficientNet-B0 Multi-Label
        Injection-Molded Plastic Defect Detection
    </span>

</footer>


</body>

</html>
